spring:
  application:
    name: ecorodagem-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecorodagem}
    username: ${DB_USERNAME:seu_usuario}
    password: ${DB_PASSWORD:sua_senha}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Sao_Paulo

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    time-zone: America/Sao_Paulo
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Integração com o Microsserviço de IA em Python (FastAPI + LLM)
ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

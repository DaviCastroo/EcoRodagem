{% extends 'principal/base.html' %}

{% block title %}Cadastrar Veículo - EcoRodagem{% endblock %}

{% block page_title %}Cadastrar Veículo{% endblock %}
{% block page_subtitle %}Adicione um novo veículo ao sistema{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                Cadastrar Veículo
            </button>
        </form>
    </div>
</div>
{% endblock %}
